<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Public repo, internal prototype: keep it out of search results. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Caidentia — Navigation Prototype</title>
    <!-- No CDNs here on purpose. Tailwind is compiled by PostCSS and imported
         from src/main.jsx, and React/lucide are bundled, so a built page
         renders with the network off. The Google Fonts preconnects that used
         to sit here were hints for a stylesheet that was never loaded — the
         prototype has always fallen back to the system sans. -->
    <style>
      html, body { height: 100%; margin: 0; }
      #root { height: 100%; }

      /* ── Split view: app 70% | survey 30% ───────────────────────── */
      .split {
        display: grid;
        grid-template-columns: 7fr 3fr;
        height: 100vh;
        overflow: hidden;
      }
      /* transform makes this the containing block for the app's
         position:fixed overlays, so modals stay inside the left pane */
      .split__app {
        position: relative;
        min-width: 0;
        height: 100vh;
        overflow: hidden;
        transform: translateZ(0);
      }
      .split__survey {
        position: sticky;
        top: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        min-width: 0;
        border-left: 1px solid #D0D5DD;
        background: #F9FAFB;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .survey__head {
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
        padding: 12px 24px;
        border-bottom: 1px solid #EAECF0;
        background: #FFFFFF;
      }
      .survey__title { margin: 0; font-size: 14px; font-weight: 600; color: #101828; }
      .survey__sub { margin: 2px 0 0; font-size: 12px; color: #667085; }
      .survey__frame { flex: 1; width: calc(100% - 48px); margin: 8px 24px 0; border: 0; background: transparent; }
      .survey__empty {
        flex: 1; display: flex; align-items: center; justify-content: center;
        padding: 24px; text-align: center; font-size: 13px; line-height: 1.5; color: #667085;
      }
      .survey__empty code { background: #EAECF0; padding: 1px 5px; border-radius: 4px; color: #344054; }

      /* narrow screens: stack the survey under the app */
      @media (max-width: 900px) {
        .split { grid-template-columns: 1fr; grid-template-rows: 65vh 35vh; }
        .split__app, .split__survey { height: auto; }
        .split__survey { position: relative; border-left: 0; border-top: 1px solid #D0D5DD; }
      }
    </style>

  <body>
    <div class="split">
      <main class="split__app">
        <div id="root"></div>
      </main>

      <aside class="split__survey" aria-label="Survey">
        <div class="survey__head">
          <div>
            <p class="survey__title">Survey</p>
            <p class="survey__sub">Try the screen on the left while answering</p>
            <p class="survey__sub">왼쪽 화면을 사용해 보면서 응답해 주세요</p>
          </div>
        </div>
        <iframe class="survey__frame" id="survey-frame" title="Survey" loading="lazy" hidden></iframe>
        <div class="survey__empty" id="survey-empty">
          <div>설문 링크가 아직 설정되지 않았어요.<br>파일 안의 <code>SURVEY_URL</code> 값을 설문 주소로 바꿔 주세요.</div>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Caidentia — Navigation Test</title>
    <style>
      html, body { height: 100%; margin: 0; }
      [hidden] { display: none !important; }
      body { background: #E8ECF7; }

      /* ── Split view: prototype 70% | survey 30% ─────────────────── */
      .split {
        display: grid;
        grid-template-columns: 7fr 3fr;
        height: 100vh;
        overflow: hidden;
      }
      .split__app {
        position: relative;
        min-width: 0;
        height: 100vh;
        overflow: hidden;
        background: #E8ECF7;
      }
      /* The prototype runs in its own iframe so its popovers and modals
         measure their own viewport. It is laid out at DESIGN_WIDTH and
         scaled down to fit the pane; its height is stretched so the
         background always fills the pane. */
      .app__frame {
        position: absolute;
        top: 0; left: 0;
        border: 0;
        transform-origin: 0 0;
        background: #FFFFFF;
      }
      .split__survey {
        position: sticky;
        top: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        min-width: 0;
        border-left: 1px solid #D0D5DD;
        background: #F9FAFB;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .survey__head {
        padding: 12px 24px;
        border-bottom: 1px solid #EAECF0;
        background: #FFFFFF;
      }
      .survey__title { margin: 0; font-size: 14px; font-weight: 600; color: #101828; }
      .survey__sub { margin: 2px 0 0; font-size: 12px; color: #667085; }
      .survey__frame { flex: 1; width: calc(100% - 48px); margin: 8px 24px 0; border: 0; background: transparent; }
      .survey__empty {
        flex: 1; display: flex; align-items: center; justify-content: center;
        padding: 24px; text-align: center; font-size: 13px; line-height: 1.5; color: #667085;
      }
      .survey__empty code { background: #EAECF0; padding: 1px 5px; border-radius: 4px; color: #344054; }

      /* narrow screens: stack the survey under the prototype */
      @media (max-width: 900px) {
        .split { grid-template-columns: 1fr; grid-template-rows: 65vh 35vh; }
        .split__app, .split__survey { height: auto; }
        .split__survey { position: relative; border-left: 0; border-top: 1px solid #D0D5DD; }
      }
    </style>
  </head>
  <body>
    <div class="split">
      <main class="split__app" id="app-pane">
        <iframe class="app__frame" id="app-frame" title="Caidentia prototype"></iframe>
      </main>

      <aside class="split__survey" aria-label="Survey">
        <div class="survey__head">
          <p class="survey__title">Survey</p>
          <p class="survey__sub">Try the screen on the left while answering</p>
          <p class="survey__sub">왼쪽 화면을 사용해 보면서 응답해 주세요</p>
        </div>
        <iframe class="survey__frame" id="survey-frame" title="Survey" loading="lazy" hidden></iframe>
        <div class="survey__empty" id="survey-empty">
          <div>설문 링크가 아직 설정되지 않았어요.<br>파일 안의 <code>SURVEY_URL</code> 값을 설문 주소로 바꿔 주세요.</div>
        </div>
      </aside>
    </div>

    <script>
      (function () {
        var b64 = document.getElementById("app-src").textContent.trim();
        var bin = atob(b64), bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        var url = URL.createObjectURL(new Blob([bytes], { type: "text/html;charset=utf-8" }));
        document.getElementById("app-frame").src = url;
      })();
    </script>
    <script>
      /* ▼ 설문 링크 (Tally /r/ 링크는 자동으로 embed 주소로 바뀜) */
      var SURVEY_URL = "https://tally.so/r/rjzG5L";

      /* ▼ 프로토타입이 깨지지 않는 최소 가로폭(px). 왼쪽 영역이 이보다 좁으면 비율대로 축소 */
      var DESIGN_WIDTH = 1360;

      (function () {
        if (!SURVEY_URL) return;
        var f = document.getElementById("survey-frame");
        var embed = SURVEY_URL.replace("tally.so/r/", "tally.so/embed/");
        if (embed !== SURVEY_URL) embed += "?alignLeft=1&transparentBackground=1";
        f.src = embed; f.hidden = false;
        document.getElementById("survey-empty").hidden = true;
      })();

      (function () {
        var pane = document.getElementById("app-pane");
        var frame = document.getElementById("app-frame");
        function fit() {
          var w = pane.clientWidth, h = pane.clientHeight;
          var scale = Math.min(1, w / DESIGN_WIDTH);
          frame.style.width = (w / scale) + "px";
          frame.style.height = (h / scale) + "px";
          frame.style.transform = scale < 1 ? "scale(" + scale + ")" : "none";
          /* 상단 컨트롤 바는 축소하지 않음: 프로토타입 안으로 배율을 전달 */
          if (frame.contentWindow) frame.contentWindow.postMessage({ type: "bar-fit", scale: scale, width: w }, "*");
        }
        frame.addEventListener("load", fit);
        fit();
        if (window.ResizeObserver) new ResizeObserver(fit).observe(pane);
        window.addEventListener("resize", fit);
      })();
    </script>
